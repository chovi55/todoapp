<title>AIポスト工房</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --surface-2:#EAEFEC;
  --ink:#151E1B; --ink-2:#3C4B46; --muted:#6A7B75;
  --line:#DAE2DE; --line-strong:#C2CEC9;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8; --accent-dim:#8FC4B6;
  --warn:#A4560B; --warn-soft:#FBECD8;
  --bad:#B03A34; --good:#2C7A4B;
  --shadow:0 1px 2px rgba(21,30,27,.06), 0 8px 24px -16px rgba(21,30,27,.28);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --display:"Zen Antique", serif;
  --ui:"Zen Kaku Gothic New", -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101513; --surface:#171E1B; --surface-2:#1F2825;
    --ink:#E7EEEA; --ink-2:#BCC9C4; --muted:#8698920;
    --muted:#869892;
    --line:#28322E; --line-strong:#3A4742;
    --accent:#3FBFA0; --accent-ink:#08221C; --accent-soft:#17342C; --accent-dim:#2C6D5C;
    --warn:#D99A4E; --warn-soft:#2E2517;
    --bad:#E0736C; --good:#5FBF85;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#101513; --surface:#171E1B; --surface-2:#1F2825;
  --ink:#E7EEEA; --ink-2:#BCC9C4; --muted:#869892;
  --line:#28322E; --line-strong:#3A4742;
  --accent:#3FBFA0; --accent-ink:#08221C; --accent-soft:#17342C; --accent-dim:#2C6D5C;
  --warn:#D99A4E; --warn-soft:#2E2517;
  --bad:#E0736C; --good:#5FBF85;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--ui); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

/* ---------- shell ---------- */
.shell{max-width:1240px; margin:0 auto; padding:0 20px 96px}
.top{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:26px 0 18px; border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--display); font-size:27px; line-height:1; letter-spacing:.06em}
.wordmark span{color:var(--accent)}
.tagline{color:var(--muted); font-size:13px}
.top .spacer{flex:1}
.badge{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--line-strong); border-radius:999px; padding:3px 10px; color:var(--muted)}

.notice{margin:16px 0 0; padding:12px 14px; border:1px solid var(--line-strong); border-left:3px solid var(--warn);
  background:var(--warn-soft); border-radius:var(--r-s); font-size:13.5px; color:var(--ink-2)}
.notice b{color:var(--ink)}

/* ---------- persona bar ---------- */
.persona{margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow)}
.persona>summary{cursor:pointer; list-style:none; padding:11px 16px; display:flex; align-items:center; gap:10px; font-size:13.5px}
.persona>summary::-webkit-details-marker{display:none}
.persona>summary::before{content:"▸"; color:var(--accent); font-size:11px; transition:transform .15s}
.persona[open]>summary::before{transform:rotate(90deg)}
.persona .sum-label{font-weight:700}
.persona .sum-value{color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.persona-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; padding:4px 16px 18px}

/* ---------- layout ---------- */
.work{display:grid; grid-template-columns:246px minmax(0,1fr); gap:26px; margin-top:24px; align-items:start}
@media (max-width:900px){ .work{grid-template-columns:1fr; gap:18px} }

/* ---------- tool rail ---------- */
.rail{position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; padding-right:4px;
  scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent}
@media (max-width:900px){ .rail{position:static; max-height:none; overflow:visible} }
.rail-group+.rail-group{margin-top:20px}
.rail-head{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); padding:0 4px 7px; display:flex; gap:8px; align-items:center}
.rail-head::after{content:""; flex:1; height:1px; background:var(--line)}
.rail-list{display:flex; flex-direction:column; gap:3px}
@media (max-width:900px){
  .rail-list{flex-direction:row; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin}
  .rail-list .t-desc{display:none}
  .tool-btn{white-space:nowrap; flex:0 0 auto}
}
.tool-btn{display:block; width:100%; text-align:left; background:none; border:1px solid transparent;
  border-radius:var(--r-s); padding:7px 10px; cursor:pointer; color:var(--ink-2); transition:background .12s,color .12s}
.tool-btn:hover{background:var(--surface-2); color:var(--ink)}
.tool-btn .t-name{font-size:13.5px; font-weight:500; display:block; line-height:1.5}
.tool-btn .t-desc{font-size:11.5px; color:var(--muted); display:block; line-height:1.5}
.tool-btn[aria-current="true"]{background:var(--accent-soft); border-color:var(--accent-dim); color:var(--ink)}
.tool-btn[aria-current="true"] .t-name{font-weight:700}

/* ---------- panel ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow); overflow:hidden}
.panel-head{padding:20px 22px 16px; border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.panel-head h2{font-size:21px; margin:6px 0 4px; font-weight:700; letter-spacing:.01em; text-wrap:balance}
.panel-head p{margin:0; color:var(--muted); font-size:13.5px; max-width:62ch}
.panel-body{padding:18px 22px 22px; display:flex; flex-direction:column; gap:16px}

label.field{display:flex; flex-direction:column; gap:6px}
.field-label{font-size:12.5px; font-weight:700; color:var(--ink-2)}
.field-label .opt{font-weight:400; color:var(--muted); font-size:11.5px; margin-left:6px}
.field-hint{font-size:11.5px; color:var(--muted); line-height:1.6}
input[type=text], textarea, select{width:100%; background:var(--paper); border:1px solid var(--line-strong);
  border-radius:var(--r-s); padding:9px 11px; font-size:14.5px; line-height:1.7}
textarea{resize:vertical; min-height:84px}
input[type=text]:focus, textarea:focus, select:focus{border-color:var(--accent); outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}

.drop{border:1.5px dashed var(--line-strong); border-radius:var(--r-m); padding:16px; text-align:center;
  background:var(--paper); cursor:pointer; transition:border-color .12s, background .12s}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop p{margin:0; font-size:13px; color:var(--muted)}
.drop img{max-height:190px; border-radius:var(--r-s); margin-top:4px}

.actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding-top:2px}
.btn{border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--r-s);
  padding:9px 16px; cursor:pointer; font-size:14px; font-weight:500; transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.btn-primary:hover:not(:disabled){background:var(--accent); filter:brightness(1.08)}
.btn-sm{padding:4px 10px; font-size:12px; border-radius:var(--r-s)}
.actions .grow{flex:1}

/* ---------- output ---------- */
.out{margin-top:22px; display:flex; flex-direction:column; gap:16px}
.status{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-m); padding:14px 18px; font-size:14px}
.pulse{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:0 0 auto;
  animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25; transform:scale(.8)} 50%{opacity:1; transform:scale(1.15)}}
.status .clock{font-family:var(--mono); font-size:12px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums}
.status.err{border-left:3px solid var(--bad)}
.status.err .pulse{background:var(--bad); animation:none}

.notes{background:var(--accent-soft); border-radius:var(--r-m); padding:12px 16px; font-size:13.5px; color:var(--ink-2)}
.notes b{color:var(--ink)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow)}
.card-head{display:flex; align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid var(--line)}
.chip{font-size:11.5px; font-weight:700; letter-spacing:.04em; background:var(--accent-soft); color:var(--accent);
  border-radius:999px; padding:2px 11px}
.card-head .spacer{flex:1}
.count{font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.count.over{color:var(--bad); font-weight:600}
.post-body{padding:15px 18px; white-space:pre-wrap; font-size:15.5px; line-height:1.95; word-break:break-word}
.thread{border-top:1px dashed var(--line-strong); padding:0 18px 6px 18px}
.reply{position:relative; padding:13px 0 13px 22px}
.reply::before{content:""; position:absolute; left:6px; top:0; bottom:0; width:2px; background:var(--line-strong)}
.reply:last-child::before{bottom:calc(100% - 24px)}
.reply::after{content:""; position:absolute; left:2.5px; top:19px; width:9px; height:9px; border-radius:50%;
  background:var(--surface); border:2px solid var(--accent-dim)}
.reply-label{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
.reply-body{white-space:pre-wrap; font-size:15px; line-height:1.95; word-break:break-word}
.card-foot{display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); background:var(--paper);
  border-radius:0 0 var(--r-m) var(--r-m); flex-wrap:wrap}

/* review mode */
.score-row{display:flex; align-items:center; gap:18px; padding:18px; flex-wrap:wrap}
.score-num{font-family:var(--mono); font-size:44px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.score-num small{font-size:16px; color:var(--muted); font-weight:400}
.verdict{flex:1; min-width:240px; font-size:14px; color:var(--ink-2)}
.axes{display:flex; flex-direction:column; gap:9px; padding:0 18px 18px}
.axis{display:grid; grid-template-columns:8.5em 1fr auto; gap:12px; align-items:center; font-size:13px}
.axis-name{color:var(--ink-2); font-weight:500}
.meter{height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.meter i{display:block; height:100%; border-radius:99px; background:var(--accent)}
.axis-note{grid-column:1/-1; color:var(--muted); font-size:12.5px; padding-left:calc(8.5em + 12px); margin-top:-4px}
.axis-val{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.fixes{padding:0 18px 18px; margin:0; display:flex; flex-direction:column; gap:8px; list-style:none}
.fixes li{position:relative; padding-left:22px; font-size:14px; color:var(--ink-2)}
.fixes li::before{content:"→"; position:absolute; left:0; color:var(--accent); font-weight:700}

/* ideas mode */
.idea{display:grid; grid-template-columns:auto 1fr; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line)}
.idea:last-of-type{border-bottom:none}
.idea-n{font-family:var(--mono); font-size:12px; color:var(--muted); padding-top:4px; font-variant-numeric:tabular-nums}
.idea h4{margin:0 0 3px; font-size:15.5px; font-weight:700; line-height:1.6}
.idea p{margin:0; font-size:13px; color:var(--muted); line-height:1.7}
.idea-send{margin-top:9px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}

/* figure mode */
.figure-wrap{padding:16px; background:var(--paper); border-radius:0 0 var(--r-m) var(--r-m); overflow-x:auto}
.figure-wrap svg{display:block; max-width:100%; height:auto; margin:0 auto;
  border:1px solid var(--line); border-radius:var(--r-s); background:#fff}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px); opacity:0;
  background:var(--ink); color:var(--paper); padding:9px 20px; border-radius:999px; font-size:13.5px;
  pointer-events:none; transition:opacity .18s, transform .18s; z-index:50}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

.foot{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px;
  display:flex; gap:16px; flex-wrap:wrap}
.hide{display:none !important}
</style>

<div class="shell">
  <header class="top">
    <div class="wordmark">AIポスト<span>工房</span></div>
    <div class="tagline">X / Threads の投稿を、1テーマ入力から5分で。</div>
    <div class="spacer"></div>
    <div class="badge" id="mode-badge">起動中</div>
  </header>

  <div id="offline-notice" class="notice hide">
    <b>このページ単体ではAIを呼べません。</b>
    各ツールの「プロンプトをコピー」で指示文を取り出して、ChatGPT / Claude / Gemini に貼り付けても同じ結果が得られます。
  </div>

  <details class="persona" id="persona">
    <summary>
      <span class="sum-label">アカウント設定</span>
      <span class="sum-value" id="persona-summary">未設定（全ツールの出力に反映されます）</span>
    </summary>
    <div class="persona-grid">
      <label class="field">
        <span class="field-label">発信ジャンル</span>
        <input type="text" id="p-genre" placeholder="例：30代からの美容 / 副業ライティング">
      </label>
      <label class="field">
        <span class="field-label">読者（誰に届けたいか）</span>
        <input type="text" id="p-target" placeholder="例：仕事と育児で時間がない30代女性">
      </label>
      <label class="field">
        <span class="field-label">語り口</span>
        <select id="p-tone">
          <option value="やさしい丁寧語。読者に寄り添う">やさしい・寄り添い型</option>
          <option value="短く言い切る。断定調で歯切れよく">歯切れよく断定する</option>
          <option value="フランクなタメ口寄り。友達に話すトーン">フランク・友達口調</option>
          <option value="実績と数字で語る。ビジネス寄りの落ち着いた文体">ビジネス・実績ベース</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">一人称 <span class="opt">任意</span></span>
        <input type="text" id="p-person" placeholder="例：私 / ぼく / うち">
      </label>
    </div>
  </details>

  <div class="work">
    <nav class="rail" id="rail" aria-label="ツール一覧"></nav>
    <main>
      <section class="panel">
        <div class="panel-head">
          <div class="eyebrow" id="tool-cat"></div>
          <h2 id="tool-name"></h2>
          <p id="tool-desc"></p>
        </div>
        <div class="panel-body">
          <div id="form"></div>
          <div class="actions">
            <button class="btn btn-primary" id="run">作成する</button>
            <button class="btn" id="stop" hidden>止める</button>
            <span class="grow"></span>
            <button class="btn btn-sm" id="copy-prompt">プロンプトをコピー</button>
          </div>
        </div>
      </section>
      <div class="out" id="out"></div>
    </main>
  </div>

  <footer class="foot">
    <span>出力はAIの生成物です。数値・固有名詞・効能は必ずご自身で確認してから投稿してください。</span>
    <span>文字数は X の全角換算（140字＝280ウェイト）基準です。</span>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ============ utils ============ */
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("apk:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("apk:" + k, JSON.stringify(v)); } catch {} },
};
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("コピーしました"); return; } catch {}
  const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = text;
  document.body.append(ta); ta.select();
  try { document.execCommand("copy"); toast("コピーしました"); }
  catch { toast("コピーできませんでした。長押しで選択してください"); }
  ta.remove();
}
/* X の重み付け文字数（全角=2, 半角=1）を全角換算に直す */
function jpLen(s) {
  let w = 0;
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    const half = c <= 0x10ff || (c >= 0x2000 && c <= 0x200d) || (c >= 0x2010 && c <= 0x201f) || (c >= 0x2032 && c <= 0x2037);
    w += half ? 1 : 2;
  }
  return Math.ceil(w / 2);
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));

/* ============ 共通プロンプト ============ */
const CORE = `あなたは、XとThreadsで2万フォロワー超のアカウントを複数運用してきた日本語のSNSコピーライターです。次の運用知見を必ず守って書きます。

【伸びるポストの原則】
- 1行目で止める。読者の「自分ごと」か「意外性」を最初の15文字以内に置く。
- 1文を短く。20〜25字前後で改行し、2〜3行ごとに空行を入れて余白をつくる。
- 抽象語を避け、数字・時間・金額・固有名詞など具体を入れる。
- 断定する。「〜かもしれません」「〜だと思います」は削る。
- 結論を先に、理由と具体を後に。
- 返信（リプ）に続きを置くと滞在時間が伸びる。本文は「続きが気になる」で終える。
- 読者が「保存したい」「人に教えたい」と思う情報密度にする。

【やらないこと】
- ハッシュタグは使わない。
- 絵文字は多用しない。使うなら1ポストに0〜2個、意味のある位置だけ。
- 「いかがでしたか」「〜していきましょう」「〜な方も多いのではないでしょうか」のようなブログ的・AIらしい定型文を書かない。
- 体言止めの連発、「である」調と「ですます」調の混在をしない。
- 検証できない数字・実績・肩書きを勝手に作らない。一般論として言える範囲に留める。
- 「必ず痩せる」「絶対に稼げる」のような効果保証や、医療・投資の断定的アドバイスを書かない。

【文字数の目安（全角換算）】
- 短文：40〜60字 / 王道：120〜140字 / リプ誘導の本文：120〜140字、リプは1つ100〜140字。`;

const F_POSTS = `【出力形式】次のJSONだけを返してください。前後に説明文やコードフェンスを付けないでください。
{"notes":"この案の狙いと投稿時のひと工夫を2文以内で","posts":[{"label":"案の名前","body":"本文","replies":["返信1","返信2"]}]}
本文や返信の改行は \\n で表してください。返信が不要な案は "replies": [] にしてください。`;

function persona() {
  const g = $("#p-genre").value.trim(), t = $("#p-target").value.trim();
  const tone = $("#p-tone").value, p = $("#p-person").value.trim();
  const lines = [];
  if (g) lines.push(`- 発信ジャンル：${g}`);
  if (t) lines.push(`- 読者：${t}`);
  lines.push(`- 語り口：${tone}`);
  if (p) lines.push(`- 一人称：${p}`);
  return `\n\n【アカウント設定】この設定に合わせて言葉づかいと題材を選んでください。\n${lines.join("\n")}`;
}

  });
  const c = document.createElement("canvas");
  c.width = fig.w * scale; c.height = fig.h * scale;
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise((r) => c.toBlob(r, "image/png"));
}
function renderFigure(out, d) {
  const fig = buildFigure(d, cur.style);
  const name = (String(d?.title || "zukai").replace(/[\\/:*?"<>|\s]+/g, "_") || "zukai").slice(0, 40);
  const card = el("div", { class: "card" },
    el("div", { class: "card-head" },
      el("span", { class: "chip", text: "図解" }),
      el("span", { class: "spacer" }),
      el("span", { class: "count", text: `${fig.w} × ${fig.h}px` })));
  const wrapEl = el("div", { class: "figure-wrap" });
  wrapEl.innerHTML = fig.svg;
  card.append(wrapEl);
  const foot = el("div", { class: "card-foot" });
  if (downloads) {
    foot.append(el("button", { class: "btn btn-sm", type: "button", text: "PNGで保存", onclick: async (e) => {
      const b = e.target; b.disabled = true;
      try { const png = await svgToPng(fig); await downloads.save({ filename: name + ".png", data: png }); toast("保存しました"); }
      catch (err) { if (err?.code !== "declined") toast("保存できませんでした"); }
      finally { b.disabled = false; }
    } }));
    foot.append(el("button", { class: "btn btn-sm", type: "button", text: "SVGで保存", onclick: async () => {
      try { await downloads.save({ filename: name + ".svg", data: fig.svg }); toast("保存しました"); }
      catch (err) { if (err?.code !== "declined") toast("保存できませんでした"); }
    } }));
  } else {
    foot.append(el("span", { class: "field-hint", text: "この環境では画像を保存できません。図解を長押し／右クリックで保存してください。" }));
  }
  card.append(foot);
  out.append(card);
  const posts = Array.isArray(d?.posts) ? d.posts : [];
  for (const p of posts) out.append(postCard(p));
}

/* ============ 起動 ============ */
function personaSummary() {
  const g = $("#p-genre").value.trim(), t = $("#p-target").value.trim();
  const tone = $("#p-tone").selectedOptions[0]?.textContent || "";
  const parts = [g, t, tone].filter(Boolean);
  $("#persona-summary").textContent = parts.length ? parts.join(" ／ ") : "未設定（全ツールの出力に反映されます）";
}
function initPersona() {
  const saved = store.get("persona", {});
  for (const [id, k] of [["p-genre", "genre"], ["p-target", "target"], ["p-tone", "tone"], ["p-person", "person"]]) {
    const n = $("#" + id);
    if (saved[k] != null) n.value = saved[k];
    const save = () => {
      store.set("persona", { genre: $("#p-genre").value, target: $("#p-target").value, tone: $("#p-tone").value, person: $("#p-person").value });
      personaSummary();
    };
    n.addEventListener("input", save);
    n.addEventListener("change", save);
  }
  personaSummary();
  if (!saved.genre) $("#persona").open = true;
}

renderRail();
renderTool();

  if (!use) { $("#mode-badge").textContent = "プロンプト出力のみ"; $("#offline-notice").classList.remove("hide"); return; }
  const [s, dl] = await Promise.all([
    Promise.resolve(window.claude.use("sample")).catch(() => null),
    Promise.resolve(window.claude.use("downloads")).catch(() => null),
  ]);
  sample = s; downloads = dl;
  if (!sample) { $("#mode-badge").textContent = "プロンプト出力のみ"; $("#offline-notice").classList.remove("hide"); return; }
  $("#mode-badge").textContent = "AI接続済み";

  imgLimits = lim?.images || null;

})();

})();
